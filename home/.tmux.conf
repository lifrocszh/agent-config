# Keep the default tmux prefix
set -g prefix C-b
unbind C-a
bind C-b send-prefix

# Quality of life
set -g mouse on
set -g history-limit 100000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 0
set -g set-clipboard on
if-shell 'test -n "$WSL_DISTRO_NAME"' 'set -g copy-command "clip.exe"' 'set -g copy-command "pbcopy"'

# Preserve working directory when splitting
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Vim-like pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Reload config
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

# Vi-style copy mode
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Native Catppuccin-ish UI, no plugins
set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-justify left
set -g status-left-length 40
set -g status-right-length 100

# Colors
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g message-style "bg=#313244,fg=#cdd6f4"
set -g mode-style "bg=#89b4fa,fg=#1e1e2e"

# Window list
setw -g window-status-style "bg=#1e1e2e,fg=#7f849c"
setw -g window-status-format " #I:#W "
setw -g window-status-current-style "bg=#89b4fa,fg=#1e1e2e,bold"
setw -g window-status-current-format " #I:#W "
set -g window-status-separator ""

# Pane borders
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"

# Status left/right
set -g status-left "#[bg=#89b4fa,fg=#1e1e2e,bold] #S #[bg=#1e1e2e,fg=#89b4fa]"
set -g status-right "#[fg=#a6e3a1]#(whoami) #[fg=#f9e2af]%H:%M #[fg=#89b4fa]%d %b"

# Activity and titles
setw -g monitor-activity on
set -g visual-activity off
set -g set-titles on
set -g set-titles-string "#S:#I.#P #W"
